<script>
const c=document.getElementById('c'),g=c.getContext('2d',{alpha:false}),W=480,H=720,HZ=190; c.width=W*2; c.height=H*2; g.scale(2,2); g.imageSmoothingEnabled=false; let PY=630,PYT=630;
const MAX_BOSSES=4; let AC,paused=true,S,LV=1,BEST=[0,0,0],drawnState=false,muted=false,liteGraphics=false;try{BEST=[0,1,2].map(i=>+localStorage.getItem('apoTropBest'+i)||0)}catch(e){}const keys={};

/* ===== CONFIGURAÇÃO E ÁUDIO ===== */

function T(f1,f2,du,ty,v,dl){if(!AC||muted)return;const t=AC.currentTime+(dl||0),o=AC.createOscillator(),a=AC.createGain();o.type=ty;o.frequency.setValueAtTime(f1,t);o.frequency.exponentialRampToValueAtTime(Math.max(20,f2),t+du);a.gain.setValueAtTime(v,t);a.gain.exponentialRampToValueAtTime(.0001,t+du);o.connect(a);a.connect(AC.destination);o.start(t);o.stop(t+du+.02)}
function sfx(k,dl=0){
 if(k==='shoot')T(500,900,.08,'sine',.04,dl);
 else if(k==='pop')T(320,110,.14,'sine',.09,dl);
 else if(k==='item')[523,659,784,1047].forEach((f,i)=>T(f,f,.09,'sine',.07,dl+i*.07));
 else if(k==='boss'){T(130,70,.45,'sine',.1,dl);T(110,60,.5,'sine',.1,dl+.5)}
 else if(k==='hurt')T(320,110,.2,'sine',.08,dl);
